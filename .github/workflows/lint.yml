name: Skill-Struktur prüfen

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  check:
    # Dieser Skill enthält kein ausführbares Node-Projekt. Ein GitHub-Runner
    # prüft deshalb nur die tatsächlich versionierte Skill-Struktur.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Erforderliche Skill-Dateien prüfen
        run: |
          set -euo pipefail
          for datei in README.md SECURITY.md skill/SKILL.md package.json.example tsconfig.json; do
            test -f "$datei"
          done

      - name: JSON-Beispiel prüfen
        run: python3 -m json.tool package.json.example >/dev/null
